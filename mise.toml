[tools]
# CI installs the same version from this file (jdx/mise-action).
bun = "1.4.4"

[tasks.setup]
description = "Install packages, create/migrate the dev database and load the sample contacts"
run = ["bun install", "bun run db:setup", "bun run db:seed"]

[tasks.dev]
description = "Start the dev server on http://localhost:5173"
run = "bun run dev"

[tasks."dev:lan"]
description = "Start the dev server reachable from phones on the same network"
run = "bun run dev:lan"

[tasks.test]
description = "Run the unit tests (same command as CI)"
run = "bun run test"

[tasks."test:e2e"]
description = "Run the browser tests in headless Firefox (same command as CI)"
run = "bun run test:e2e"

[tasks.check]
description = "Type-check the app (svelte-check)"
run = "bun run check"

[tasks."db:setup"]
description = "Create and migrate the dev database (safe to rerun)"
run = "bun run db:setup"

[tasks."db:seed"]
description = "Add the sample contacts to the dev database (skips ones that already exist)"
run = "bun run db:seed"

[tasks."db:reset"]
description = "DELETES the dev database, recreates it and loads the sample contacts"
run = "bun run db:reset"
