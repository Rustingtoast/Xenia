[tools]
# Keep in sync with .ruby-version (used by CI) and RUBY_VERSION in the Dockerfile.
ruby = "4.0.9"

[tasks.setup]
description = "Install gems, prepare the database and start the dev server (add -- --skip-server to only set up)"
run = "bin/setup"

[tasks.dev]
description = "Start Rails + Tailwind watcher on http://localhost:3000"
run = "bin/dev"

[tasks."dev:lan"]
description = "Start the dev server reachable from phones on the same network"
env = { BINDING = "0.0.0.0" }
run = "bin/dev"

[tasks.test]
description = "Run the test suite (same command as CI)"
run = "bin/rails db:test:prepare test"

[tasks."test:system"]
description = "Run browser-based system tests in headless Firefox (same command as CI)"
run = "bin/rails db:test:prepare test:system"

[tasks.lint]
description = "Run RuboCop and Brakeman"
run = ["bin/rubocop", "bin/brakeman --no-pager -q"]

[tasks."db:setup"]
description = "Create and migrate the database; a new dev database also gets sample contacts (safe to rerun)"
run = "bin/rails db:prepare"

[tasks."db:seed"]
description = "Add the sample contacts to the dev database (skips ones that already exist)"
run = "bin/rails db:seed"

[tasks."db:reset"]
description = "DELETES the dev database, recreates it from db/schema.rb and loads the sample contacts"
run = "bin/rails db:reset"
