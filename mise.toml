[tools]
# Keep in sync with .ruby-version (used by CI) and RUBY_VERSION in the Dockerfile.
ruby = "4.0.9"

[tasks.setup]
description = "Install gems, prepare the database and start the dev server (add -- --skip-server to only set up)"
run = "bin/setup"

[tasks.dev]
description = "Start Rails + Tailwind watcher on http://localhost:3000"
run = "bin/dev"

[tasks."dev:lan"]
description = "Start the dev server reachable from phones on the same network"
env = { BINDING = "0.0.0.0" }
run = "bin/dev"

[tasks.test]
description = "Run the test suite (same command as CI)"
run = "bin/rails db:test:prepare test"

[tasks."test:system"]
description = "Run browser-based system tests in headless Chrome (same command as CI)"
run = "bin/rails db:test:prepare test:system"

[tasks.lint]
description = "Run RuboCop and Brakeman"
run = ["bin/rubocop", "bin/brakeman --no-pager -q"]
