<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="application-name" content="Xenia" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="%sveltekit.assets%/icon.png" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.png" />
		<script>
			// Apply a saved light/dark choice before the first paint (no flash).
			// Without one, daisyUI follows the OS. See src/lib/components/ThemeToggle.svelte.
			try {
				var theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-dvh bg-base-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
