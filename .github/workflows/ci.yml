name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Types, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Bun at the version pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # Fails on moderate or worse; low findings are listed but don't block. (2026-11-08: one low,
      # deepmerge via @sveltejs/vite-plugin-svelte, build-time only, no fixed version exists.)
      - name: Scan dependencies for known vulnerabilities
        run: bun audit --audit-level=moderate

  e2e:
    name: Browser tests (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps firefox
      - run: bun run test:e2e
      - name: Keep screenshots and traces of failed tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
